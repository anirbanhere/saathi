name: Saathi self-hosted
on:
  pull_request:
  push:
    branches: ["codex/self-hosted-storage", "codex/self-hosted-api", "codex/self-hosted-demo", "codex/model-selection"]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: openbot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: python3 -m unittest discover -s ../deploy/public/tests -p "test_*.py" -v
      - run: bun test self-hosted
      - run: bun run --cwd server typecheck
      - run: bun run typecheck:tests
      - run: bun ../scripts/build-demo.ts --audit
      - run: python3 ../deploy/public/release_inputs.py ../artifacts/public-build --check
      - run: bun ../deploy/public/smoke-bundle.ts
